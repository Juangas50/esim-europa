name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (informativo — no bloquea el merge)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Placeholders — el build no necesita conectarse a nada real,
          # pero Next.js igual evalúa estas env vars al compilar y falla
          # si faltan (aunque el código nunca las use en esta etapa).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: placeholder
          NEXT_PUBLIC_BASE_URL: https://esimruta34.com
          NEXT_PUBLIC_SITE_URL: https://esimruta34.com
